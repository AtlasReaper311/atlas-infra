# Reusable workflow: build a service's Dockerfile and push it to the
# GitHub Container Registry under ghcr.io/atlasreaper311/<image_name>.
#
# This only builds and publishes an artifact. It never touches a running
# service anywhere. Pulling a published image into an actual deployment
# stays a separate, deliberate step, the same split atlas-interface-kit
# and worker-meta-kit already use for git-tag releases.
#
# Called from a consuming repo like:
#
#   jobs:
#     publish:
#       uses: AtlasReaper311/atlas-infra/.github/workflows/publish-container-image.yml@<pinned atlas-infra main sha>
#       with:
#         image_name: atlas-corpus

name: Publish Container Image

on:
  workflow_call:
    inputs:
      image_name:
        description: "Image name under ghcr.io/atlasreaper311/, e.g. atlas-corpus"
        required: true
        type: string
      context:
        description: "Docker build context, relative to the calling repo root"
        required: false
        type: string
        default: "."
      dockerfile:
        description: "Path to the Dockerfile, relative to context"
        required: false
        type: string
        default: "Dockerfile"

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image-${{ inputs.image_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
