name: Dependabot review policy

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: dependabot-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Always land a completed job on non-Dependabot PRs. If every job is
  # filtered out by if:, GitHub concludes the workflow as failed/empty and
  # pollutes the PR check rollup.
  non-dependabot:
    if: >-
      github.actor != 'dependabot[bot]' ||
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Skip Dependabot policy
        run: echo "Not a Dependabot pull request; review policy does not apply."

  review:
    permissions:
      contents: write
      issues: write
      pull-requests: write
    if: >-
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.user.login == 'dependabot[bot]'
    uses: AtlasReaper311/atlas-infra/.github/workflows/dependabot-review.yml@8e6d08701823b02c4859bfc72af67fc8ace1f4b5
    with:
      automerge_enabled: ${{ vars.DEPENDABOT_AUTOMERGE_ENABLED == 'true' }}
