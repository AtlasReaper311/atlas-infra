name: Gardener automation authority

on:
  pull_request:
    paths:
      - "contracts/v1/gardener/**"
      - "docs/adrs/ADR-0006-automatic-remediation-controller.md"
      - "docs/runbooks/gardener-automatic-remediation.md"
      - "policy/gardener-automation.json"
      - "policy/gardener-automation.schema.json"
      - "policy/gardener-github-app-coverage.json"
      - "policy/gardener-target-readiness.json"
      - "scripts/validate_gardener_automation.py"
      - "scripts/validate_gardener_target_readiness.py"
      - "scripts/tests/test_validate_gardener_automation.py"
      - "scripts/tests/test_validate_gardener_target_readiness.py"
      - ".github/workflows/gardener-automation-authority.yml"
  push:
    branches: [main]
    paths:
      - "contracts/v1/gardener/**"
      - "docs/adrs/ADR-0006-automatic-remediation-controller.md"
      - "docs/runbooks/gardener-automatic-remediation.md"
      - "policy/gardener-automation.json"
      - "policy/gardener-automation.schema.json"
      - "policy/gardener-github-app-coverage.json"
      - "policy/gardener-target-readiness.json"
      - "scripts/validate_gardener_automation.py"
      - "scripts/validate_gardener_target_readiness.py"
      - "scripts/tests/test_validate_gardener_automation.py"
      - "scripts/tests/test_validate_gardener_target_readiness.py"
      - ".github/workflows/gardener-automation-authority.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-gardener-automation-authority-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate automatic remediation authority
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0, Node 24

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.3.0, Node 24
        with:
          python-version: "3.12"

      - name: Parse policy and contract schemas
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          paths = [
              "contracts/v1/gardener/gardener-automation-approval.schema.json",
              "contracts/v1/gardener/gardener-finding-bundle.schema.json",
              "policy/gardener-automation.json",
              "policy/gardener-automation.schema.json",
              "policy/gardener-target-readiness.json",
          ]
          for value in paths:
              json.loads(Path(value).read_text(encoding="utf-8"))
          PY

      - name: Compile authority validators
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/validate_gardener_automation.py
          python3 -m py_compile scripts/validate_gardener_target_readiness.py

      - name: Validate committed authority
        run: |
          set -euo pipefail
          python3 scripts/validate_gardener_automation.py \
            --report /tmp/gardener-automation-authority.json
          python3 scripts/validate_gardener_target_readiness.py \
            --report /tmp/gardener-target-readiness.json

      - name: Run authority unit tests
        run: |
          set -euo pipefail
          python3 -m unittest scripts.tests.test_validate_gardener_automation -v
          python3 -m unittest scripts.tests.test_validate_gardener_target_readiness -v

      - name: Validate ADR traceability
        run: |
          set -euo pipefail
          python3 scripts/adr_trace.py check --root . > /tmp/gardener-adr-trace.log 2>&1

      - name: Upload failing ADR trace output
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gardener-adr-trace-output
          path: /tmp/gardener-adr-trace.log
          if-no-files-found: error
          retention-days: 1

      - name: Check whitespace
        run: git diff --check
